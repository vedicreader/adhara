[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "adhara"
dynamic = ["version"]
description = "Native FTS5 tokenizer and hybrid FTS + vector search for SQLite, as a loadable extension"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ["sqlite", "fts5", "vector search", "hybrid search", "sanskrit", "tokenizer"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Rust",
               "Topic :: Database", "Topic :: Text Processing :: Indexing"]

[project.optional-dependencies]
dev = ["fastship>=0.1.9", "maturin>=1.9,<2", "pytest>=8", "apsw>=3.50", "numpy>=1.26", "litesearch>=0.1.60", "laghu>=0.3.1"]

[project.urls]
Homepage = "https://github.com/vedicreader/adhara"
Repository = "https://github.com/vedicreader/adhara"
Issues = "https://github.com/vedicreader/adhara/issues"

[tool.fastship]
branch = "main"

[tool.maturin]
features = ["python"]
module-name = "adhara._adhara"
python-source = "python"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
